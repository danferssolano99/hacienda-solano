<!doctype html>
<html lang="es" data-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Hacienda Solano — Banner alojamiento domo</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../brand/brand-tokens.css" />
    <link rel="stylesheet" href="../../assets/export.css" />
    <link rel="stylesheet" href="../../assets/components/button/button.css" />
    <style>
      * { box-sizing: border-box; margin: 0; }

      html, body {
        width: 1200px;
        height: 630px;
        min-width: 1200px;
        min-height: 630px;
        overflow: hidden;
        margin: 0;
        padding: 0;
        display: block;
      }

      body {
        background: var(--color-warm-cream);
        font-family: var(--font-body);
        color: var(--text-primary);
      }

      .banner {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        isolation: isolate;
      }

      .media {
        position: absolute;
        inset: 0 0 0 46%;
        z-index: -2;
      }

      .media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: saturate(0.88) contrast(1.02) brightness(0.88);
      }

      .overlay {
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(90deg, rgba(245, 241, 230, 0.98) 0%, rgba(245, 241, 230, 0.94) 38%, rgba(245, 241, 230, 0.46) 53%, rgba(26, 51, 28, 0.10) 100%),
          linear-gradient(0deg, rgba(14, 28, 16, 0.20) 0%, transparent 42%);
      }

      .accent {
        position: absolute;
        right: 34%;
        bottom: -6%;
        width: 380px;
        height: 380px;
        opacity: 0.12;
        pointer-events: none;
      }

      .accent img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .content {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 520px;
        height: 100%;
        padding: 64px;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .logo {
        width: 200px;
        height: auto;
      }

      .eyebrow {
        padding-left: 18px;
        border-left: 1px solid rgba(26, 51, 28, 0.12);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--color-brand-green);
      }

      .hero {
        display: grid;
        gap: 22px;
        margin: auto 0;
      }

      h1 {
        max-width: 11ch;
        font-family: var(--font-title);
        font-size: 68px;
        line-height: 0.96;
        letter-spacing: -0.045em;
        text-wrap: balance;
      }

      .supporting {
        max-width: 42ch;
        font-size: 18px;
        line-height: 1.65;
        color: rgba(26, 51, 28, 0.72);
      }

      .cta-wrap {
        padding-top: 18px;
        border-top: 1px solid rgba(26, 51, 28, 0.10);
      }

      .hs-btn {
        min-height: 50px;
        padding-inline: 26px;
      }

      .guide {
        position: absolute;
        top: 14px;
        right: 14px;
        padding: 7px 10px;
        border-radius: 8px;
        background: rgba(26, 51, 28, 0.82);
        color: #fff;
        font-size: 11px;
      }
    </style>
    <script src="../../assets/export.js" defer></script>
  </head>
  <body>
    <main class="banner" data-export-canvas data-export-width="1200" data-export-height="630" aria-label="Banner de alojamiento domo Hacienda Solano">
      <div class="media" aria-hidden="true">
        <img src="../../assets/photos/alojamiento/Domo.jpeg" alt="" />
      </div>
      <div class="overlay" aria-hidden="true"></div>
      <div class="accent" aria-hidden="true">
        <img src="../../assets/decorative/shapes/organic-blob-03.svg" alt="" />
      </div>

      <section class="content">
        <div class="topbar">
          <img class="logo" src="../../assets/logo/primary/Logotipo.svg" alt="Hacienda Solano" />
          <p class="eyebrow">Alojamiento</p>
        </div>

        <div class="hero">
          <h1>Escapate a un domo de descanso.</h1>
          <p class="supporting">Bajá el ritmo, respirá naturaleza y reconectá con lo esencial en Hacienda Solano.</p>
        </div>

        <div class="cta-wrap">
          <a class="hs-btn hs-btn--primary" href="https://wa.me/51905433158" aria-label="Reservar alojamiento domo por WhatsApp">Reservar por WhatsApp</a>
        </div>
      </section>

      <div class="guide" data-export-ui>Banner domo · 1200 × 630</div>
    </main>
  </body>
</html>
