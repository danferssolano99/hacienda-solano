<!DOCTYPE html>
<html lang="es" data-color-scheme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hacienda Solano — Pill · Outline</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Manrope:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../../brand/brand-tokens.css" />
  <link rel="stylesheet" href="pill.css" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      font-family: var(--font-body);
    }

    .demo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .demo-label {
      font-family: var(--font-body);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: rgba(26, 51, 28, 0.35);
    }

    .pill-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="demo">
    <span class="demo-label">Pill · Outline</span>

    <div class="pill-group">
      <span class="hs-pill hs-pill--outline">Alojamiento</span>
      <span class="hs-pill hs-pill--outline">Eventos</span>
      <span class="hs-pill hs-pill--outline">Piscina</span>
      <span class="hs-pill hs-pill--outline">Gastronomía</span>
    </div>
  </div>
</body>
</html>
