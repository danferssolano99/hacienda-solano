<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!--
    Hacienda Solano — Sun Accent 01
    Shape: destello solar sutil con gradiente radial + rayos suaves
    Uso: hero pieces, esquinas editoriales, acento cálido
    No usar con opacidad mayor al 40% — debe ser casi imperceptible.
  -->
  <defs>
    <radialGradient id="sun-01-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FDC859" stop-opacity="0.25" />
      <stop offset="50%"  stop-color="#FDC859" stop-opacity="0.10" />
      <stop offset="80%"  stop-color="#FDC859" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FDC859" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#sun-01-grad)" />

  <!-- Rayos — 8 direcciones, muy tenues -->
  <g stroke="#FDC859" stroke-opacity="0.06" stroke-width="1" stroke-linecap="round">
    <line x1="100" y1="12"  x2="100" y2="32" />
    <line x1="100" y1="168" x2="100" y2="188" />
    <line x1="12"  y1="100" x2="32"  y2="100" />
    <line x1="168" y1="100" x2="188" y2="100" />
    <line x1="32"  y1="32"  x2="45"  y2="45" />
    <line x1="155" y1="155" x2="168" y2="168" />
    <line x1="32"  y1="168" x2="45"  y2="155" />
    <line x1="155" y1="32"  x2="168" y2="45" />
  </g>
</svg>
