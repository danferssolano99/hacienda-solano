<!doctype html>
<html lang="es" data-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hacienda Solano — Comunicado A3</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Manrope:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../brand/brand-tokens.css" />
    <style>
      /* ══════════════════════════════════════════════════════
         A3 landscape (420 × 297 mm → 2480 × 1754 px @150dpi)
         Direct scale of A4 — same CSS base, proportional sizes.
         ══════════════════════════════════════════════════════ */

      :root {
        --canvas-width: 2480px;
        --canvas-height: 1754px;

        /* ── Layout (same % margins as A4) ── */
        --margin-x: calc(var(--canvas-width) * 0.065);       /* ~161px */
        --margin-top: calc(var(--canvas-height) * 0.078);    /* ~137px */
        --margin-bottom: calc(var(--canvas-height) * 0.065); /* ~114px */

        /* ── Typography scale (based on ~22.62px root, media-distance print) ──  */
        --title-size: 11rem;         /* ~249px / 119pt — dominates for wall reading   */
        --secondary-size: 3.5rem;    /* ~79px  /  38pt — well above 24pt minimum      */
        --detail-size: 2.5rem;       /* ~57px  /  27pt — readable at room distance    */

        /* ── Logo ── */
        --logo-height: 6rem;

        /* ── Spacing ── */
        --divider-gap: 2rem;         /* ~45px  → direct scale */
        --detail-gap: 1.25rem;       /* ~28px  → direct scale */

        /* ── Divider ── */
        --divider-width: 18rem;      /* ~407px → direct scale */

        /* ── Typography tokens ── */
        --font-title: "Fraunces", Georgia, serif;
        --font-body: "Manrope", system-ui, -apple-system, sans-serif;
        --leading-title: 1.05;
        --leading-body: 1.45;
      }
    </style>
    <link rel="stylesheet" href="comunicado-base.css" />
    <script src="../../assets/export.js" defer></script>
  </head>
  <body>

    <!-- ═══════════════════════════════════════════════════ -->
    <!--  CANVAS — A3 landscape printed notice              -->
    <!--  EDITABLE SECTIONS marked with ✎ below             -->
    <!-- ═══════════════════════════════════════════════════ -->
    <main
      class="canvas"
      data-export-canvas
      data-export-width="2480"
      data-export-height="1754"
      aria-label="Comunicado impreso de Hacienda Solano — A3 horizontal"
    >

      <!-- ═══════════════════════════════════════════════════ -->
      <!--  DECORATIVE LAYERS — organic accents, z-index 0  -->
      <!-- ═══════════════════════════════════════════════════ -->

      <!-- Palm ornament: right side, atmospheric framing -->
      <img
        class="deco-palm"
        src="../../assets/decorative/ornaments/palm-02.svg"
        alt=""
        aria-hidden="true"
      />

      <!-- ── Logo signature (top-right) ── -->
      <div class="signature" aria-label="Hacienda Solano">
        <img
          src="../../assets/logo/primary/Logotipo.svg"
          alt="Logotipo Hacienda Solano"
        />
      </div>

      <!-- ── Main content ── -->
      <div class="content">

        <!-- ✎ EDITABLE: Title (Fraunces Bold, max 2 lines) -->
        <h1 class="title">
          Horario de<br />
          Atención
        </h1>

        <hr class="divider" aria-hidden="true" />

        <!-- ✎ EDITABLE: Secondary text (Manrope SemiBold) -->
        <p class="secondary">
          Lunes a Domingo — 8:00 AM a 11:00 PM
        </p>

        <!-- ✎ EDITABLE: Optional detail (Manrope Regular) -->
        <p class="detail">
          Nuestro equipo está disponible todos los días para asegurar
          que tu estadía sea perfecta, desde la mañana hasta la noche.
        </p>

      </div>

      <!-- ── Subtle bottom accent ── -->
      <div class="accent-bottom" aria-hidden="true"></div>

    </main>

  </body>
</html>
